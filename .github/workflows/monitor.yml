name: Deal monitor

on:
  schedule:
    - cron: "*/15 * * * *"        # every 15 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:               # adds a "Run workflow" button in the Actions tab
    inputs:
      test_alert:
        description: "Only send a test notification to my phone"
        type: boolean
        default: false
      dry_run:
        description: "Dry run: show matches in the log, send no alerts, save nothing"
        type: boolean
        default: false
      threshold:
        description: "Temporary discount threshold % (blank = use config.json)"
        required: false
        default: ""
      verbose:
        description: "Verbose debug logging"
        type: boolean
        default: false

permissions:
  contents: write                  # lets the bot commit seen_deals.json

concurrency:
  group: deal-monitor              # never run two copies at once
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run deal monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_ALERT: ${{ inputs.test_alert }}
          DRY_RUN: ${{ inputs.dry_run }}
          THRESHOLD_OVERRIDE: ${{ inputs.threshold }}
          VERBOSE: ${{ inputs.verbose }}
        run: python scraper.py

      - name: Save seen deals back to the repo
        if: always()
        run: |
          if [ -n "$(git status --porcelain seen_deals.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_deals.json
            git commit -m "Update seen deals"
            git pull --rebase --autostash || true
            git push
          else
            echo "No changes to seen_deals.json"
          fi
